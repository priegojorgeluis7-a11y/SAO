<head>
  <!--

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sao_windows">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Aggressive cache cleanup on every page load -->
  <script>
    // Version control - update this when deploying
    const REQUIRED_VERSION = '20260430';
    const VERSION_KEY = 'sao_app_version';
    const CACHE_VERSION_KEY = 'sao_cache_version';
    
    function cleanupCaches() {
      console.log('[SAO] Starting aggressive cache cleanup...');
      
      // 1. Get current version from storage
      const storedVersion = localStorage.getItem(VERSION_KEY);
      
      // 2. Check if version changed
      if (storedVersion !== REQUIRED_VERSION) {
        console.log('[SAO] Version changed:', storedVersion, '->', REQUIRED_VERSION);
        console.log('[SAO] Clearing all caches...');
        
        // Clear IndexedDB
        if ('indexedDB' in window) {
          const dbs = ['flutter', 'app', 'activities', 'sync'];
          dbs.forEach(db => {
            try {
              const deleteReq = indexedDB.deleteDatabase(db);
              deleteReq.onsuccess = () => console.log('[SAO] Deleted IndexedDB:', db);
              deleteReq.onerror = (e) => console.warn('[SAO] Error deleting IndexedDB:', db, e);
            } catch (e) {
              console.warn('[SAO] Could not delete IndexedDB:', db, e);
            }
          });
        }
        
        // Clear localStorage (but keep version key)
        const keys = Object.keys(localStorage);
        keys.forEach(key => {
          if (key !== VERSION_KEY && key !== CACHE_VERSION_KEY) {
            localStorage.removeItem(key);
          }
        });
        console.log('[SAO] Cleared localStorage');
        
        // Update version in storage
        localStorage.setItem(VERSION_KEY, REQUIRED_VERSION);
        console.log('[SAO] Updated version to:', REQUIRED_VERSION);
      }
      
      // 3. Unregister stale service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(r) {
            console.log('[SAO] Unregistering service worker');
            r.unregister();
          });
        }).catch(e => console.warn('[SAO] Error managing service workers:', e));
      }
      
      // 4. Clear all browser caches
      if ('caches' in window) {
        caches.keys().then(names => {
          names.forEach(name => {
            console.log('[SAO] Deleting cache:', name);
            caches.delete(name);
          });
        }).catch(e => console.warn('[SAO] Error clearing caches:', e));
      }
      
      console.log('[SAO] Cache cleanup completed');
    }
    
    // Run cleanup on page load
    cleanupCaches();
  </script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SAO</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background-color: #F8FAFC; }
    flt-glass-pane { background-color: #F8FAFC; }
  </style>
